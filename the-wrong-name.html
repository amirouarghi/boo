<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ilhem</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#02040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>:root{--ink:#02040a;--mid:#07122a;--blue:#2a4f9e;--silver:#dfe6f2;--dim:#93a1bd;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--silver);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
#bg,#dim{position:fixed;inset:0;z-index:0}
#bg{background:radial-gradient(ellipse 70% 55% at 50% 35%,#0c1f47 0%,#07122a 40%,#02040a 100%);transition:opacity 4s}
#dim{background:radial-gradient(ellipse 50% 40% at 50% 45%,rgba(20,40,90,.35),#000 80%);opacity:0;transition:opacity 5s}
body.dark #dim{opacity:.92}
#leaves{position:fixed;inset:0;width:100%;height:100%;z-index:1;opacity:0;transition:opacity 5s;pointer-events:none}
body.lit #leaves{opacity:1}
body.dark #leaves{filter:brightness(.7)}
#grain{position:fixed;inset:-50%;z-index:5;pointer-events:none;opacity:.07;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
animation:g 1s steps(4) infinite}
@keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#stage{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;
opacity:0;visibility:hidden;transition:opacity 1.3s ease,visibility 0s 1.3s}
.scene.on{opacity:1;visibility:visible;transition:opacity 1.3s ease}
.box{width:min(46rem,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.4rem;position:relative}
.box.wide{width:100%;height:100%;max-width:70rem}
.line{font-family:var(--serif);font-weight:300;font-size:clamp(1.4rem,3.4vw,2.2rem);line-height:1.45;letter-spacing:.01em;
opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease;text-shadow:0 0 24px rgba(120,160,255,.25)}
.line.show{opacity:1;transform:none}
.line.small{font-family:var(--ui);font-size:.8rem;letter-spacing:.2em;color:var(--dim)}
.line.big{font-size:clamp(1.7rem,4.2vw,2.8rem);font-style:italic}
.line.sig{font-style:italic;color:#bcd0f5}
.line.label{font-family:var(--ui);font-size:.7rem;letter-spacing:.35em;color:var(--dim)}
.typing::after{content:"";display:inline-block;width:1px;height:1em;margin-left:3px;background:var(--silver);vertical-align:-.12em;animation:b .8s steps(2) infinite}
@keyframes b{50%{opacity:0}}
/* scene 1 */
.name{font-family:var(--serif);font-weight:300;font-size:clamp(4rem,15vw,9.5rem);letter-spacing:.09em;line-height:1;
opacity:0;transition:opacity 1.6s ease;filter:drop-shadow(0 0 28px rgba(140,180,255,.4))}
.name.show{opacity:1}
.name span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(8px);transition:opacity 1.4s,filter 1.4s,transform 1.4s}
.name span.in{opacity:1;filter:none;transform:none}
.name span.out{opacity:0;filter:blur(12px);transform:translateY(-22px) scale(1.2);transition-duration:1.2s}
.name.sweep{color:transparent;background:linear-gradient(105deg,#b9c6de 38%,#fff 50%,#b9c6de 62%) 120% 0/250% 100%;
-webkit-background-clip:text;background-clip:text;animation:sw 3.2s ease-in-out .5s forwards}
@keyframes sw{to{background-position:-60% 0}}
.fix{font-family:var(--serif);font-weight:300;font-size:clamp(1.5rem,4.4vw,2.9rem);letter-spacing:.04em;line-height:1.4;min-height:1.4em;opacity:0;transition:opacity 1.3s;position:absolute;left:0;right:0;top:50%;translate:0 -50%}
.fix.show{opacity:1}
.fix s{text-decoration-thickness:1px;opacity:.5}
/* buttons */
.row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn{font:300 .95rem var(--ui);letter-spacing:.18em;color:var(--silver);background:rgba(10,24,56,.35);
border:1px solid rgba(190,205,235,.35);padding:.95rem 2.2rem;border-radius:2px;cursor:pointer;
opacity:0;transform:translateY(6px);transition:opacity 1.4s,transform 1.4s,background .5s,border-color .5s,box-shadow .5s,letter-spacing .5s}
.btn.show{opacity:1;transform:none}
.btn:hover,.btn:focus-visible{background:rgba(40,80,170,.3);border-color:rgba(220,230,250,.8);box-shadow:0 0 34px rgba(80,130,240,.35);letter-spacing:.24em;outline:none}
.btn.ghost{border-color:rgba(190,205,235,.15);color:var(--dim)}
#gate .btn{opacity:1;transform:none}
:focus-visible{outline:1px solid #9bb8f0;outline-offset:4px}
.chrome{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.6rem;pointer-events:none}
.chrome>*{pointer-events:auto}
#progress{display:flex;gap:.55rem;opacity:0;transition:opacity 2s}
body.lit #progress{opacity:1}
#progress i{width:18px;height:2px;background:rgba(190,205,235,.18);transition:background 1s,box-shadow 1s}
#progress i.on{background:rgba(210,224,255,.8);box-shadow:0 0 8px rgba(120,160,255,.6)}
.mini{font:300 .72rem var(--ui);letter-spacing:.18em;color:var(--dim);background:none;border:0;cursor:pointer;padding:.4rem}
.mini:hover{color:var(--silver)}
/* scene 4 */
.sky{position:absolute;inset:6% 4% 14%}
.sky svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sky polyline{fill:none;stroke:rgba(170,195,255,.35);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 6}
.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe0ff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.star{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:0;background:none;cursor:pointer;border-radius:50%}
.star::before{content:"";position:absolute;inset:19px;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px rgba(150,190,255,.8),0 0 60px 18px rgba(60,110,230,.45);transition:transform .5s,box-shadow .5s;animation:pulse 3.5s ease-in-out infinite}
.star:hover::before,.star:focus-visible::before{transform:scale(1.9);box-shadow:0 0 22px 9px #fff,0 0 90px 30px rgba(80,130,255,.6)}
.star.seen::before{background:#b8cdf5;opacity:.75}
@keyframes pulse{50%{opacity:.7}}
.hint{position:absolute;left:0;right:0;bottom:1%}
.cta{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:rgba(2,5,14,.82);backdrop-filter:blur(6px);
opacity:0;visibility:hidden;transition:opacity .9s,visibility 0s .9s;z-index:3}
.ov.on{opacity:1;visibility:visible;transition:opacity .9s}
.card{max-width:34rem;display:flex;flex-direction:column;gap:1.4rem;align-items:center}
.card small{font-size:.72rem;letter-spacing:.35em;color:var(--dim)}
.card p{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.45}
/* terminal */
.term{width:100%;text-align:left;font:300 clamp(.9rem,2vw,1.05rem)/1.9 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:#b9ccf0;
border:1px solid rgba(150,180,240,.2);background:rgba(4,10,26,.7);padding:clamp(1.2rem,4vw,2.4rem);border-radius:3px;box-shadow:0 0 60px rgba(40,80,190,.2);min-height:12rem}
.term p{min-height:1.9em}
.term .msg{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,2.8vw,1.7rem);line-height:1.55;color:var(--silver);margin-top:.8rem}
.term .row{margin-top:1.2rem;justify-content:flex-start}
.choices{display:flex;flex-direction:column;gap:.8rem;align-items:center}
.resp{min-height:3.2em;color:#bcd0f5}
/* end */
#s7 .box{transition:opacity 6s}
#s7 .box.fade>.line{opacity:0;transition:opacity 6s}
.endstar{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:0;
box-shadow:0 0 14px 6px rgba(160,200,255,.8),0 0 70px 24px rgba(60,110,240,.5);transition:opacity 6s;z-index:3;animation:pulse 4s infinite}
.endstar.on{opacity:1}
.replay{position:fixed;bottom:2rem;left:0;right:0;margin:auto;width:max-content;z-index:7}
#cursor{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px;border-radius:50%;z-index:9;pointer-events:none;opacity:0;
border:1px solid rgba(190,210,255,.45);background:radial-gradient(circle,rgba(130,170,255,.25),transparent 70%);transition:width .3s,height .3s,margin .3s,opacity .5s}
#cursor.on{opacity:1}
#cursor.big{width:58px;height:58px;margin:-29px}
@media(max-width:600px){#progress i{width:12px}.btn{padding:.9rem 1.5rem;letter-spacing:.14em}}
@media(prefers-reduced-motion:reduce){#grain,.dot,.star::before,.endstar{animation:none}.name.sweep{animation-duration:.01s}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="dim"></div>
<canvas id="leaves" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"></div>

<header class="chrome">
  <nav id="progress" aria-label="Progress"></nav>
  <button id="sound" class="mini" type="button" aria-pressed="false">sound off</button>
</header>

<main id="stage">
  <section id="gate" class="scene on" aria-label="Start">
    <div class="box">
      <p class="line show small">a short film, made to be watched alone.</p>
      <div class="row">
        <button class="btn" id="beginSound" type="button">Begin with sound</button>
        <button class="btn ghost" id="beginSilent" type="button">Begin in silence</button>
      </div>
    </div>
  </section>
  <section id="s1" class="scene" aria-live="polite"><div class="box"></div></section>
  <section id="s2" class="scene" aria-live="polite"><div class="box"></div></section>
  <section id="s3" class="scene" aria-live="polite"><div class="box"></div></section>
  <section id="s4" class="scene"><div class="box wide"></div></section>
  <section id="s5" class="scene" aria-live="polite"><div class="box"></div></section>
  <section id="s6" class="scene" aria-live="polite"><div class="box"></div></section>
  <section id="s7" class="scene" aria-live="polite"><div class="box"></div></section>
</main>
<script>/* THE WRONG NAME — edit the creator's name here */
const CREATOR_NAME = "Amir";

const $ = (s, r = document) => r.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? ms * 0.6 : ms));
const reflow = el => void el.offsetWidth;

/* ---------- Falling green leaves (canvas) ---------- */
const cv = $('#leaves'), cx = cv.getContext('2d');
const leaf = new Path2D('M0,-1 C.75,-.55 .8,.35 0,1 C-.8,.35 -.75,-.55 0,-1Z');
let W, H, DPR, leaves = [], last = 0, running = true;
function mkLeaf(top) {
  const h = 85 + Math.random() * 70;               // green hues only
  const l = 20 + Math.random() * 24;
  return { x: Math.random() * W, y: top ? -40 - Math.random() * 60 : Math.random() * H,
    s: 9 + Math.random() * 17, vy: (0.3 + Math.random() * 0.8) * (reduced ? .45 : 1),
    sw: 0.4 + Math.random() * 1.1, ph: Math.random() * 6.28, fs: 0.6 + Math.random() * 1.2,
    r: Math.random() * 6.28, rs: (Math.random() - .5) * .02 * (reduced ? .3 : 1),
    a: 0.35 + Math.random() * 0.5, c: `hsl(${h} ${45 + Math.random() * 25}% ${l}%)`,
    v: `hsl(${h} 50% ${l + 18}%)`, drift: 0.1 + Math.random() * 0.25 };
}
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const n = reduced ? 14 : Math.min(46, Math.max(18, Math.round(W / 34)));
  leaves = Array.from({ length: n }, () => mkLeaf(false));
}
function frame(t) {
  if (!running) return;
  const dt = Math.min((t - last) / 16.7 || 1, 3); last = t; const sec = t / 1000;
  cx.clearRect(0, 0, W, H);
  for (const p of leaves) {
    p.y += p.vy * dt; p.r += p.rs * dt;
    p.x += (Math.sin(sec * 0.5 + p.ph) * p.sw * 0.5 + p.drift) * dt;
    if (p.y > H + 40 || p.x > W + 40) Object.assign(p, mkLeaf(true));
    const flip = reduced ? 1 : Math.cos(sec * p.fs + p.ph);
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r + Math.sin(sec * .7 + p.ph) * .5);
    cx.scale(p.s * .55 * (.25 + Math.abs(flip) * .75), p.s); cx.globalAlpha = p.a;
    cx.fillStyle = p.c; cx.fill(leaf);
    cx.strokeStyle = p.v; cx.lineWidth = .07; cx.beginPath(); cx.moveTo(0, -.9); cx.lineTo(0, .9); cx.stroke();
    cx.restore();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) requestAnimationFrame(frame); });
resize(); requestAnimationFrame(frame);

/* ---------- Ambient sound (generated, starts only after a click) ---------- */
let ac, master, soundOn = false;
const soundBtn = $('#sound');
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
  [[110, 'triangle', .3], [164.8, 'sine', .18], [220.4, 'sine', .1], [329.6, 'sine', .04]].forEach(([f, ty, g]) => {
    const o = ac.createOscillator(), n = ac.createGain(); o.type = ty; o.frequency.value = f; n.gain.value = g;
    o.connect(n); n.connect(lp); o.start();
  });
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .07; lg.gain.value = 220;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(master); master.connect(ac.destination);
}
function setSound(v) {
  try { if (!ac) initAudio(); ac.resume(); master.gain.setTargetAtTime(v ? .2 : 0, ac.currentTime, .9); } catch (e) { v = false; }
  soundOn = v; soundBtn.textContent = v ? 'sound on' : 'sound off'; soundBtn.setAttribute('aria-pressed', v);
}
function chime() {
  if (!soundOn) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(.08, ac.currentTime + .05);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + 2.2); o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 2.3);
}
soundBtn.onclick = () => setSound(!soundOn);

/* ---------- Helpers ---------- */
function el(tag, cls, parent, text) {
  const e = document.createElement(tag); e.className = cls || ''; if (text) e.textContent = text;
  if (parent) parent.appendChild(e); return e;
}
async function say(parent, text, cls = '', hold = 2200) {
  const e = el('p', 'line ' + cls, parent, text); reflow(e); e.classList.add('show'); await wait(hold); return e;
}
async function type(e, text, speed = 45) {
  e.classList.add('typing', 'show');
  for (const ch of text) { e.textContent += ch; await wait(speed + (/[,.?…]/.test(ch) ? speed * 5 : 0)); }
  e.classList.remove('typing');
}
function button(parent, label, cls, fn) {
  const b = el('button', 'btn ' + (cls || ''), parent, label); b.type = 'button';
  reflow(b); b.classList.add('show'); b.addEventListener('click', () => { b.disabled = true; fn(b); }, { once: true });
  return b;
}
const N = 7, prog = $('#progress');
for (let i = 0; i < N; i++) el('i', '', prog);
function setProgress(n) { [...prog.children].forEach((d, i) => d.classList.toggle('on', i < n)); }

let cur = null;
async function go(n) {
  if (cur) { cur.classList.remove('on'); await wait(1500); }
  cur = $('#s' + n); const box = $('.box', cur); box.innerHTML = ''; box.classList.remove('fade');
  cur.classList.add('on'); setProgress(n); await wait(600); await scenes[n](box);
}

/* ---------- Scene 1: the wrong name ---------- */
async function s1(b) {
  const h = el('h1', 'name', b), f = el('p', 'fix', b);
  h.setAttribute('aria-label', 'ilham');
  await wait(2500);
  [...'ilham'].forEach((c, i) => { const s = el('span', '', h, c); s.style.transitionDelay = i * .18 + 's'; });
  h.classList.add('show'); reflow(h); [...h.children].forEach(s => s.classList.add('in'));
  await wait(3700);                                   // ~2s fully visible
  [...h.children].forEach((s, i) => { s.style.transitionDelay = i * .12 + 's'; s.classList.add('out'); });
  await wait(1500); h.remove();
  await type(f, 'bs7 kayn ghalta, ilhem mashi ilham', 75);
  f.innerHTML = 'bs7 kayn ghalta, ilhem mashi <s>ilham</s>';
  await wait(3000); f.classList.remove('show'); await wait(1500); f.remove();
  const n = el('h1', 'name', b, 'ilhem'); reflow(n); n.classList.add('show', 'sweep');
  await wait(4600); go(2);
}

/* ---------- Scene 2: the first message ---------- */
async function s2(b) {
  for (const t of ['Well... now that we\u2019ve got the name right.', 'Maybe it\u2019s time to tell you why you\u2019re here.', 'Some things are easier to create than to say.']) {
    await type(el('p', 'line', b), t, 48); await wait(1200);
  }
  button(b, 'Discover', '', () => go(3));
}

/* ---------- Scene 3: something about you ---------- */
async function s3(b) {
  for (const t of ['I had something to say.', 'But I never really knew how.', 'So I thought I\u2019d leave it here.']) await say(b, t, '', 2600);
  await wait(900); await say(b, 'Some people become a thought you never quite finish.', 'big', 4200);
  await wait(1200); go(4);
}

/* ---------- Scene 4: the constellation ---------- */
const STARS = [
  { x: 22, y: 60, k: 'A thought', t: 'Funny how someone can become part of your ordinary days without even trying.' },
  { x: 50, y: 34, k: 'A moment', t: 'Maybe the smallest conversations leave the longest echoes.' },
  { x: 78, y: 56, k: 'A question', t: 'Have you ever wondered if someone remembers the little things about you?' }];
async function s4(b) {
  b.innerHTML = `<div class="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${STARS.map(s => s.x + ',' + s.y).join(' ')}"/></svg></div>
  <div class="ov" role="dialog" aria-modal="true"><div class="card"><small></small><p></p><button class="btn show" type="button">Close</button></div></div><div class="cta"></div>`;
  const sky = $('.sky', b), ov = $('.ov', b), cta = $('.cta', b), seen = new Set();
  for (let i = 0; i < 80; i++) { const d = el('span', 'dot', sky); d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 4}s;opacity:${.3 + Math.random() * .6}`; }
  const line = $('polyline', sky), L = 400; line.style.cssText = `stroke-dasharray:${L};stroke-dashoffset:${L};transition:stroke-dashoffset 4s ease`; reflow(line); line.style.strokeDashoffset = 0;
  const close = () => { ov.classList.remove('on'); last && last.focus(); if (seen.size === 3 && !cta.children.length) setTimeout(() => button(cta, 'Continue', '', () => go(5)), 900); };
  let last;
  STARS.forEach((s, i) => {
    const st = el('button', 'star', sky); st.type = 'button'; st.style.cssText = `left:${s.x}%;top:${s.y}%`; st.setAttribute('aria-label', s.k);
    st.onclick = () => { last = st; seen.add(i); st.classList.add('seen'); chime(); $('small', ov).textContent = s.k; $('p', ov).textContent = s.t; ov.classList.add('on'); $('.btn', ov).focus(); };
  });
  $('.btn', ov).onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && ov.classList.contains('on')) close(); });
  await wait(1500); el('p', 'line small hint', b, 'touch a star').classList.add('show');
}

/* ---------- Scene 5: the unsent message ---------- */
async function s5(b) {
  const t = el('div', 'term', b);
  await type(el('p', '', t), '> A message was never sent.', 40); await wait(700);
  await type(el('p', '', t), '> Would you like to read it?', 40); await wait(600);
  const row = el('div', 'row', t);
  button(row, 'OPEN MESSAGE', '', async () => {
    row.remove(); const m = el('p', 'msg', t);
    await type(m, 'There\u2019s something strangely beautiful about the way certain people make ordinary moments feel different.', 38); await wait(1400);
    await type(el('p', 'msg', t), 'I don\u2019t know if you ever noticed. Maybe that\u2019s the point.', 42); await wait(1600);
    button(el('div', 'row', t), 'Continue', '', () => go(6));
  });
  button(row, 'NOT NOW', 'ghost', () => go(6));
}

/* ---------- Scene 6: the question ---------- */
async function s6(b) {
  await say(b, 'Before you leave, there\u2019s one thing I\u2019ve always wondered...', '', 3200);
  await say(b, 'What if the person who left this message is someone you already know?', 'big', 2400);
  const box = el('div', 'choices', b), resp = el('p', 'line resp', b);
  const R = { 'Maybe I do.': 'Then perhaps you\u2019ve already felt it \u2014 that quiet sense of recognition before the name arrives.',
    'I have no idea.': 'That\u2019s alright. Not knowing is its own kind of quiet.',
    'I think I know.': 'Hold on to that thought. Keep it just a little longer.' };
  Object.keys(R).forEach(k => button(box, k, '', async () => {
    box.querySelectorAll('button').forEach(x => { x.disabled = true; x.style.opacity = x.textContent === k ? 1 : .25; });
    resp.textContent = R[k]; reflow(resp); resp.classList.add('show'); await wait(4200);
    await say(b, 'Perhaps knowing who wrote it isn\u2019t as important as knowing why.', 'big', 2600);
    button(b, 'Continue', '', () => go(7));
  }));
  box.querySelectorAll('button').forEach(x => x.addEventListener('click', e => e.stopPropagation()));
}

/* ---------- Scene 7: the final reveal ---------- */
async function s7(b) {
  document.body.classList.add('dark'); await wait(3500);
  await say(b, 'Somewhere, between hello and goodbye...', '', 3400);
  await say(b, 'there was something I never quite managed to explain.', '', 4200);
  await wait(2200);
  await say(b, 'Maybe this was never meant to be an answer.', '', 3400);
  await say(b, 'Maybe it was just meant to make you wonder.', '', 4600);
  await wait(1500);
  await say(b, 'Made by someone who wanted to leave a little something behind.', '', 3400);
  await say(b, '\u2014 ' + CREATOR_NAME, 'sig', 4200);
  await wait(1200); await say(b, 'Goodnight, Ilhem.', 'big', 3000);
  await say(b, 'END OF TRANSMISSION \u00b7 001', 'label', 5000);
  b.classList.add('fade'); const star = el('div', 'endstar', document.body); reflow(star); star.classList.add('on');
  await wait(6500);
  const r = button(document.body, 'Replay', 'replay', () => {
    r.remove(); star.classList.remove('on'); document.body.classList.remove('dark'); setTimeout(() => star.remove(), 1500); go(1);
  });
}
const scenes = { 1: s1, 2: s2, 3: s3, 4: s4, 5: s5, 6: s6, 7: s7 };

/* ---------- Start (audio only after a click) ---------- */
function begin(sound) {
  setSound(sound); document.body.classList.add('lit');
  const g = $('#gate'); g.classList.remove('on'); cur = g; go(1);
}
$('#beginSound').onclick = () => begin(true);
$('#beginSilent').onclick = () => begin(false);

/* ---------- Custom cursor (desktop only) ---------- */
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  const c = $('#cursor'); let tx = 0, ty = 0, x = 0, y = 0;
  addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; c.classList.add('on'); });
  document.addEventListener('mouseleave', () => c.classList.remove('on'));
  document.addEventListener('mouseover', e => c.classList.toggle('big', !!e.target.closest('button')));
  (function loop() { x += (tx - x) * .18; y += (ty - y) * .18; c.style.transform = `translate(${x}px,${y}px)`; requestAnimationFrame(loop); })();
}
</script>
